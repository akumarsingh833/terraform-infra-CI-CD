name: Terraform Plan CI

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================================
  # 1. CREATE TERRAFORM BACKEND
  # ==========================================================
  terraform_backend:
    name: CREATE TERRAFORM BACKEND
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create backend resource group
        run: |
          az group create \
            --name rg-terraform-state \
            --location eastus

      - name: Create backend storage account
        run: |
          az storage account create \
            --name stterraformstatespy \
            --resource-group rg-terraform-state \
            --location eastus \
            --sku Standard_LRS \
            --https-only true \
            --min-tls-version TLS1_2

      - name: Create blob container
        run: |
          az storage container create \
            --name tfstate \
            --account-name stterraformstatespy \
            --auth-mode login


  # ==========================================================
  # 2. TERRAFORM CI
  # ==========================================================
  terraform_ci:
    name: TERRAFORM CI
    runs-on: ubuntu-latest
    needs: terraform_backend

    defaults:
      run:
        working-directory: ./environment/dev

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Terraform Format Check
      # ------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -recursive


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        run: terraform init


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


      # ------------------------------------------------------
      # TFLint
      # ------------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Run TFLint
        run: |
          tflint --init
          tflint


      # ------------------------------------------------------
      # Gitleaks
      # ------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------
      # Checkov
      # ------------------------------------------------------
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./environment/dev
          framework: terraform
          soft_fail: false


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan.binary